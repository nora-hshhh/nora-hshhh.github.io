<article class="about-card">
  {{- with .Get "icon" -}}<i class="{{ . }}" aria-hidden="true"></i>{{- end -}}
  <h3>{{ .Get "title" }}</h3>
  <p>
    <span class="about-school">{{ .Get "school" }}</span>
    <span class="about-time">{{ .Get "time" }}</span>
    {{- with .Inner -}}
      <span class="about-detail">{{ . | markdownify }}</span>
    {{- end -}}
  </p>
</article>
